name: performance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Benchmark mode
        required: true
        default: churn
        type: choice
        options:
          - standard
          - churn
          - soak
          - profile

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run benchmark
        shell: bash
        run: |
          set -o pipefail
          case "${{ inputs.mode }}" in
            standard)
              npm run bench 2>&1 | tee benchmark-output.txt
              ;;
            churn)
              npm run bench:churn 2>&1 | tee benchmark-output.txt
              ;;
            soak)
              npm run bench:soak 2>&1 | tee benchmark-output.txt
              ;;
            profile)
              npm run bench:profile 2>&1 | tee benchmark-output.txt
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: world-core-${{ inputs.mode }}-${{ github.run_id }}
          path: benchmark-output.txt
          retention-days: 30
