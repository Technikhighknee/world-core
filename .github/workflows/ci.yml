name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scalability benchmark smoke
        env:
          BENCH_CITIES: 2
          BENCH_GRID_SIZE: 6
          BENCH_ENTITIES_PER_CITY: 100
          BENCH_MOVERS_PER_CITY: 30
          BENCH_TICKS: 20
          BENCH_ROUTE_QUERIES: 50
          BENCH_MEMORY_SAMPLE_EVERY: 5
        run: npm run bench
      - name: Churn benchmark smoke
        env:
          CHURN_CITIES: 2
          CHURN_GRID_SIZE: 6
          CHURN_ENTITIES: 200
          CHURN_MOVERS: 100
          CHURN_TICKS: 20
          CHURN_REROUTES_PER_TICK: 5
          CHURN_STOP_STARTS_PER_TICK: 5
          CHURN_MOVER_REPLACEMENTS_PER_TICK: 2
          CHURN_IDLE_REPLACEMENTS_PER_TICK: 2
          CHURN_RETENTION_CHECK_EVERY: 10
          CHURN_MEMORY_SAMPLE_EVERY: 5
        run: npm run bench:churn

      - name: Steering benchmark smoke
        env:
          STEERING_COUNTS: 50
          STEERING_WARMUP_TICKS: 3
          STEERING_TICKS: 8
          STEERING_DELTA_SECONDS: 0.1
        run: npm run bench:steering

      - name: Determinism soak smoke
        env:
          DETERMINISM_TICKS: 80
          DETERMINISM_ENTITIES: 30
          DETERMINISM_HASH_EVERY: 10
          DETERMINISM_SAVE_TICK: 40
        run: npm run bench:determinism

      - name: Snapshot benchmark smoke
        env:
          SNAPSHOT_CITIES: 2
          SNAPSHOT_GRID_SIZE: 6
          SNAPSHOT_ENTITIES: 200
          SNAPSHOT_MOVERS: 80
        run: npm run bench:snapshot

      - name: Performance guardrail harness smoke
        env:
          GUARDRAIL_FAST: 1
        run: npm run bench:guardrails

      - name: Domain scaling benchmark smoke
        env:
          DOMAIN_BENCH_DOMAINS: 50000
          DOMAIN_BENCH_TRANSFERS: 50000
        run: npm run bench:domains

      - name: Retention benchmark smoke
        env:
          CHURN_CITIES: 2
          CHURN_GRID_SIZE: 6
          CHURN_ENTITIES: 200
          CHURN_MOVERS: 100
          CHURN_TICKS: 10
          CHURN_REROUTES_PER_TICK: 2
          CHURN_STOP_STARTS_PER_TICK: 2
          CHURN_MOVER_REPLACEMENTS_PER_TICK: 1
          CHURN_IDLE_REPLACEMENTS_PER_TICK: 1
          CHURN_RETENTION_CHECK_EVERY: 5
        run: npm run bench:retention
